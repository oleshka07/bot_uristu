name: Deploy to Hetzner

# Auto-deploys on every push to the working branch: the server pulls the new
# code and rebuilds the container. Secrets are never printed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_HOST          server IP, e.g. 46.225.132.220
#   SSH_USER          ssh user, e.g. root
#   SSH_PRIVATE_KEY   private deploy key whose public half is in the server's
#                     ~/.ssh/authorized_keys
#   DEPLOY_PATH       e.g. /root/projects/networking-ai
# Optional:
#   SSH_PORT          defaults to 22
#   ENV_FILE          full contents of the server .env. If set, it overwrites
#                     .env on deploy. Leave UNSET to keep the server's existing
#                     .env untouched (recommended once it's configured).
#
# The server's .env and docker-compose.override.yml are untracked, so
# `git reset --hard` never touches them. The override (127.0.0.1:8002 behind
# nginx) is auto-loaded by `docker compose up`.

on:
  push:
    branches:
      - claude/networking-ai-contact-service-o73dse
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: ENV_FILE,DEPLOY_PATH,BRANCH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            if [ ! -d .git ]; then
              echo "Repo not present at $DEPLOY_PATH. Clone it once (see docs/DEPLOY_HETZNER.md)."
              exit 1
            fi
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"
            if [ -n "$ENV_FILE" ]; then
              printf '%s' "$ENV_FILE" > .env
            fi
            docker compose up -d --build
            docker image prune -f
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BRANCH: ${{ github.ref_name }}
